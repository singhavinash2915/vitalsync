<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VitalSync — offline</title>
    <meta name="theme-color" content="#0b0f14" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b0f14;
        --card: #111820;
        --border: #1e2936;
        --text: #e8eef5;
        --muted: #8494a6;
        --accent: #38bdf8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --card: #fff;
          --border: #e2e5ea;
          --text: #0d1117;
          --muted: #5b6673;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
      }
      .ring {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 1rem;
        background: rgba(56, 189, 248, 0.12);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.6;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        height: 2.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: #07090d;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ring" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        VitalSync can&rsquo;t reach Supabase right now. Any data already loaded on your device is
        still cached &mdash; reconnect to sync new entries.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
