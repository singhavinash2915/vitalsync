[functions.health-sync]
# The gateway's default JWT check rejects any request without an Authorization
# header — including the X-Sync-Key requests this endpoint exists to serve.
# Turning it off does NOT make the function public: it authenticates every
# caller itself, either by looking the sync key up against its SHA-256 hash or
# by validating a Supabase access token. Requests with neither get a 401.
verify_jwt = false

[functions.ai-coach]
# Unlike health-sync, this one does NOT authenticate callers itself, and every
# request it accepts spends money at Anthropic. Let Supabase reject anything
# without a valid access token before it reaches the function.
verify_jwt = true

[functions.nutrition-estimate]
# Same reasoning as ai-coach: it spends money at Anthropic, so let Supabase
# reject anything without a valid project token before it reaches the function.
verify_jwt = true
